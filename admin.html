<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Daniel Mods Admin</title>

<script src="https://cdn.tailwindcss.com"></script>


<style>

body {
  overflow-x: hidden;
}


.bubble {
  position: fixed;
  border-radius: 50%;
  filter: blur(8px);
  opacity: 0.18;
  pointer-events: none;
  animation: floatBubble 12s ease-in-out infinite;
}


.bubble1 {
  width: 190px;
  height: 190px;
  background: #10b981;
  left: -60px;
  top: 10%;
}


.bubble2 {
  width: 230px;
  height: 230px;
  background: #8b5cf6;
  right: -80px;
  top: 40%;
  animation-delay: 2s;
}


.bubble3 {
  width: 150px;
  height: 150px;
  background: #06b6d4;
  left: 30%;
  bottom: -50px;
  animation-delay: 4s;
}


.bubble4 {
  width: 120px;
  height: 120px;
  background: #ec4899;
  right: 25%;
  top: 5%;
  animation-delay: 6s;
}


@keyframes floatBubble {

  0%, 100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-35px) scale(1.08);
  }

}


.glass {
  background: rgba(15,23,42,.82);
  backdrop-filter: blur(15px);
}

</style>

</head>


<body class="bg-slate-950 text-white min-h-screen">


<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>
<div class="bubble bubble3"></div>
<div class="bubble bubble4"></div>


<!-- LOGIN -->

<div
  id="loginPage"
  class="relative z-10 min-h-screen
         flex items-center justify-center p-4">


  <div
    class="glass border border-slate-800
           rounded-3xl p-6 w-full max-w-md
           shadow-2xl">


    <h1
      class="text-2xl font-black
             text-emerald-400 text-center">

      DANIEL MODS

    </h1>


    <p
      class="text-sm text-slate-400
             text-center mt-1">

      Admin Login

    </p>


    <div class="mt-6 space-y-3">


      <input
        id="email"
        type="email"
        placeholder="Email"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3 outline-none">


      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3 outline-none">


      <button
        id="loginButton"
        class="w-full bg-emerald-500
               hover:bg-emerald-600
               text-slate-950
               font-bold py-3 rounded-xl">

        Login

      </button>


      <p
        id="loginError"
        class="hidden text-red-400
               text-sm text-center">
      </p>


    </div>

  </div>

</div>



<!-- DASHBOARD -->

<div
  id="dashboard"
  class="hidden relative z-10
         max-w-5xl mx-auto p-4 sm:p-6">


  <!-- HEADER -->

  <header
    class="glass border border-slate-800
           rounded-2xl p-4
           flex justify-between
           items-center mb-6">


    <div>

      <h1
        class="text-lg font-black
               text-emerald-400">

        DANIEL MODS ADMIN

      </h1>

      <p
        class="text-xs text-slate-400">

        Dashboard

      </p>

    </div>


    <button
      id="logoutButton"
      class="bg-red-500/10
             border border-red-500/30
             text-red-400
             px-4 py-2
             rounded-xl text-xs">

      Logout

    </button>


  </header>



  <!-- VERIFICATION SETTINGS -->

  <section
    class="glass border border-slate-800
           rounded-2xl p-6 mb-6">


    <h2 class="text-lg font-bold">

      YouTube / Telegram Verification

    </h2>


    <p
      class="text-xs text-slate-400
             mt-1 mb-5">

      Public shortener page के
      verification buttons control करें।

    </p>



    <!-- YOUTUBE -->

    <div
      class="bg-slate-950/70
             border border-slate-800
             rounded-xl p-4 mb-4">


      <label
        class="flex items-center gap-3
               font-semibold text-sm mb-3">


        <input
          id="youtubeEnabled"
          type="checkbox"
          class="w-4 h-4 accent-emerald-500">


        ▶ Enable YouTube

      </label>


      <input
        id="youtubeUrl"
        type="url"
        placeholder="YouTube Channel URL"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3 text-sm
               outline-none">

    </div>



    <!-- TELEGRAM -->

    <div
      class="bg-slate-950/70
             border border-slate-800
             rounded-xl p-4 mb-4">


      <label
        class="flex items-center gap-3
               font-semibold text-sm mb-3">


        <input
          id="telegramEnabled"
          type="checkbox"
          class="w-4 h-4 accent-emerald-500">


        ✈ Enable Telegram

      </label>


      <input
        id="telegramUrl"
        type="url"
        placeholder="Telegram Channel URL"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3 text-sm
               outline-none">

    </div>



    <button
      id="saveSettingsButton"
      class="w-full bg-emerald-500
             hover:bg-emerald-600
             text-slate-950
             font-bold py-3 rounded-xl">

      Save Verification Settings

    </button>


    <p
      id="settingsMessage"
      class="hidden text-center
             text-emerald-400
             text-sm mt-3">

      ✓ Settings Saved

    </p>


  </section>



  <!-- CREATE SHORT LINK -->

  <section
    class="glass border border-slate-800
           rounded-2xl p-6 mb-6">


    <h2
      class="text-lg font-bold mb-4">

      Create New Short Link

    </h2>


    <div class="space-y-3">


      <input
        id="originalUrl"
        type="url"
        placeholder="Destination URL"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3
               outline-none">


      <input
        id="shortCode"
        type="text"
        placeholder="Custom Short Code (optional)"
        class="w-full bg-slate-900
               border border-slate-800
               rounded-xl p-3
               outline-none">


      <button
        id="createLinkButton"
        class="w-full bg-emerald-500
               hover:bg-emerald-600
               text-slate-950
               font-bold py-3 rounded-xl">

        Generate Short Link

      </button>


      <p
        id="createMessage"
        class="hidden text-center
               text-sm">
      </p>


    </div>

  </section>



  <!-- LINK TABLE -->

  <section
    class="glass border border-slate-800
           rounded-2xl overflow-hidden">


    <div
      class="p-4 border-b
             border-slate-800">


      <h2 class="font-bold">

        Manage Existing Links

      </h2>


    </div>


    <div class="overflow-x-auto">

      <table class="w-full text-sm">

        <thead
          class="bg-slate-950/70
                 text-slate-400">


          <tr>

            <th class="p-4 text-left">
              Short Code
            </th>

            <th class="p-4 text-left">
              Original URL
            </th>

            <th class="p-4">
              Clicks
            </th>

            <th class="p-4">
              Status
            </th>

            <th class="p-4">
              Actions
            </th>

          </tr>

        </thead>


        <tbody id="linksTable">

        </tbody>

      </table>

    </div>

  </section>


</div>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

  apiKey: "AIzaSyCy2eAzZQ9n6v_DbAlW-v4OnGYM-_l5Kpc",

  authDomain:
    "firepannel.firebaseapp.com",

  projectId:
    "firepannel",

  storageBucket:
    "firepannel.appspot.com",

  messagingSenderId:
    "630511495335",

  appId:
    "1:630511495335:web:cbab90bf6e54266e97d382"

};



const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);



const loginPage =
  document.getElementById("loginPage");


const dashboard =
  document.getElementById("dashboard");



/* AUTH */

onAuthStateChanged(
  auth,
  user => {

    if (user) {

      loginPage.classList.add("hidden");

      dashboard.classList.remove("hidden");

      loadSettings();

      loadLinks();

    }

    else {

      loginPage.classList.remove("hidden");

      dashboard.classList.add("hidden");

    }

  }
);



/* LOGIN */

document
.getElementById("loginButton")
.addEventListener(
  "click",
  async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

    catch (error) {

      const box =
        document.getElementById("loginError");

      box.classList.remove("hidden");

      box.innerText =
        "Login failed: " + error.message;

    }

  }
);



/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  () => {

    signOut(auth);

  }
);



/* LOAD SETTINGS */

async function loadSettings() {

  const ref =
    doc(
      db,
      "settings",
      "shortener"
    );


  const snapshot =
    await getDoc(ref);


  if (!snapshot.exists()) {

    return;

  }


  const data =
    snapshot.data();


  document
    .getElementById("youtubeEnabled")
    .checked =
      data.youtubeEnabled === true;


  document
    .getElementById("youtubeUrl")
    .value =
      data.youtubeUrl || "";


  document
    .getElementById("telegramEnabled")
    .checked =
      data.telegramEnabled === true;


  document
    .getElementById("telegramUrl")
    .value =
      data.telegramUrl || "";

}



/* SAVE SETTINGS */

document
.getElementById("saveSettingsButton")
.addEventListener(
  "click",
  async () => {

    const youtubeEnabled =
      document
      .getElementById("youtubeEnabled")
      .checked;


    const youtubeUrl =
      document
      .getElementById("youtubeUrl")
      .value.trim();


    const telegramEnabled =
      document
      .getElementById("telegramEnabled")
      .checked;


    const telegramUrl =
      document
      .getElementById("telegramUrl")
      .value.trim();


    await setDoc(

      doc(
        db,
        "settings",
        "shortener"
      ),

      {
        youtubeEnabled,
        youtubeUrl,
        telegramEnabled,
        telegramUrl
      },

      {
        merge: true
      }

    );


    const message =
      document
      .getElementById("settingsMessage");


    message.classList.remove("hidden");


    setTimeout(
      () => {
        message.classList.add("hidden");
      },
      2000
    );

  }
);



/* CREATE SHORT LINK */

document
.getElementById("createLinkButton")
.addEventListener(
  "click",
  async () => {

    const originalUrl =
      document
      .getElementById("originalUrl")
      .value.trim();


    let shortCode =
      document
      .getElementById("shortCode")
      .value.trim();


    if (!originalUrl) {

      alert("Destination URL डालें");

      return;

    }


    if (!shortCode) {

      shortCode =
        Math.random()
        .toString(36)
        .substring(2, 8);

    }


    const links =
      collection(db, "links");


    const existing =
      await getDocs(
        query(
          links
        )
      );


    let duplicate = false;


    existing.forEach(
      item => {

        if (
          item.data().shortCode ===
          shortCode
        ) {

          duplicate = true;

        }

      }
    );


    if (duplicate) {

      alert("यह Short Code पहले से मौजूद है");

      return;

    }


    await addDoc(

      links,

      {
        originalUrl,
        shortCode,
        clicks: 0,
        active: true
      }

    );


    document
      .getElementById("originalUrl")
      .value = "";


    document
      .getElementById("shortCode")
      .value = "";


    loadLinks();

  }
);



/* LOAD LINKS */

async function loadLinks() {

  const table =
    document.getElementById(
      "linksTable"
    );


  table.innerHTML = "";


  const snapshot =
    await getDocs(
      collection(
        db,
        "links"
      )
    );


  snapshot.forEach(
    item => {

      const data =
        item.data();


      const tr =
        document.createElement("tr");


      tr.className =
        "border-t border-slate-800";


      tr.innerHTML = `

        <td class="p-4 text-emerald-400 font-mono">
          ${escapeHtml(data.shortCode || "")}
        </td>

        <td class="p-4 max-w-xs truncate">
          ${escapeHtml(data.originalUrl || "")}
        </td>

        <td class="p-4 text-center">
          ${data.clicks || 0}
        </td>

        <td class="p-4 text-center">

          ${
            data.active !== false

            ? '<span class="text-emerald-400">Active</span>'

            : '<span class="text-red-400">Disabled</span>'
          }

        </td>

        <td class="p-4 text-center space-x-2">

          <button
            class="toggleBtn
                   bg-slate-800
                   px-3 py-2
                   rounded-lg text-xs">

            ${data.active !== false
              ? "Disable"
              : "Enable"}

          </button>


          <button
            class="deleteBtn
                   bg-red-500/10
                   text-red-400
                   px-3 py-2
                   rounded-lg text-xs">

            Delete

          </button>

        </td>
      `;


      tr
      .querySelector(".toggleBtn")
      .addEventListener(
        "click",
        async () => {

          await updateDoc(

            doc(
              db,
              "links",
              item.id
            ),

            {
              active:
                data.active === false
            }

          );


          loadLinks();

        }
      );


      tr
      .querySelector(".deleteBtn")
      .addEventListener(
        "click",
        async () => {

          if (
            !confirm(
              "Delete this link?"
            )
          ) return;


          await deleteDoc(

            doc(
              db,
              "links",
              item.id
            )

          );


          loadLinks();

        }
      );


      table.appendChild(tr);

    }
  );

}



/* SECURITY */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
